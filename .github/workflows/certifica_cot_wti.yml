name: Certifica COT WTI - audit strutturale 2010-2026
'on':
  workflow_dispatch:
  push:
    paths:
      - 'certifica_cot_wti.py'
      - '.github/workflows/certifica_cot_wti.yml'
jobs:
  certifica:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: python -m pip install 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Verifica sintassi
        run: python -m py_compile certifica_cot_wti.py
      - name: Ricostruisci e controlla serie
        run: python certifica_cot_wti.py
      - name: Carica audit anche se il controllo fallisce
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cot-wti-067651-audit
          path: audit_cot_wti/
          if-no-files-found: warn
          retention-days: 30
