name: Macro Swing Lab - Certificazione PIT v3 unificata
on:
  workflow_dispatch:
    inputs:
      serie:
        description: "Serie da elaborare: ALL oppure un codice (es. GDP)"
        required: false
        default: ALL
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        env:
          REQUESTED_SERIES: ${{ inputs.serie }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os,json,pathlib,zipfile
          required=['storico-pit-64-completo.zip','macro-swing-lab-associazione-pit.zip','certifica_pit_v3.py','aggrega_pit_v3.py']
          missing=[x for x in required if not pathlib.Path(x).is_file()]
          if missing:raise SystemExit('File mancanti nella root: '+', '.join(missing))
          for name in required[:2]:
              if not zipfile.is_zipfile(name):raise SystemExit('ZIP non valido: '+name)
          series=['ANFCI','BAA10Y','BAMLH0A0HYM2','CPIAUCSL','CPILFESL','DCOILWTICO','DFEDTARU','DFII10','DGS10','DGS2','DGS3MO','DTWEXBGS','FEDFUNDS','GDP','ICSA','INDPRO','JTSJOL','M2SL','NFCI','PAYEMS','PCEPI','PCEPILFE','PPIACO','RRPONTSYD','RSXFS','SOFR','STLFSI4','T10Y2Y','T10YIE','T5YIE','UMCSENT','UNRATE','USEPUINDXD','VIXCLS','WALCL','WRESBAL']
          requested=os.environ.get('REQUESTED_SERIES','ALL').strip().upper() or 'ALL'
          if requested!='ALL':
              if requested not in series:raise SystemExit('Serie sconosciuta: '+requested)
              series=[requested]
          print('matrix='+json.dumps({'serie':series},separators=(',',':')))
          PY
  certifica:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verifica API key
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          test -n "$FRED_API_KEY" || { echo 'FRED_API_KEY non configurata'; exit 1; }
      - name: Verifica serie ALFRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python certifica_pit_v3.py --series "${{ matrix.serie }}" --budget-seconds 2100
      - name: Registra diagnostica del job
        if: always()
        env:
          SERIES: ${{ matrix.serie }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p risultati_certificazione_pit_v3
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('risultati_certificazione_pit_v3')
          files=[str(f.relative_to(p)) for f in p.rglob('*') if f.is_file()]
          (p/'diagnostica_job.json').write_text(json.dumps({'serie':os.environ['SERIES'],'stato_job':os.environ['JOB_STATUS'],'file_prodotti':files},indent=2),encoding='utf-8')
          PY
      - name: Salva report della serie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-v3-${{ matrix.serie }}
          path: risultati_certificazione_pit_v3/
          if-no-files-found: error
          retention-days: 30
  aggrega:
    needs: [preflight,certifica]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica tutti gli artifact delle serie
        uses: actions/download-artifact@v4
        with:
          pattern: pit-v3-*
          path: input_serie
          merge-multiple: false
      - name: Unisci risultati con aggregatore originale
        id: aggregate
        continue-on-error: true
        run: python aggrega_pit_v3.py --input input_serie --out report_pit_v3
      - name: Prepara archivio diagnostico completo
        if: always()
        env:
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          REQUESTED_SERIES: ${{ inputs.serie }}
        run: |
          python - <<'PY'
          import pathlib,json,zipfile,os
          root=pathlib.Path('input_serie'); out=pathlib.Path('report_pit_v3')
          out.mkdir(exist_ok=True)
          folders=sorted(p for p in root.glob('pit-v3-*') if p.is_dir()) if root.exists() else []
          manifest={'serie_richiesta':os.environ.get('REQUESTED_SERIES','ALL'),'esito_aggregatore':os.environ['AGGREGATE_OUTCOME'],'artifact_trovati':len(folders),'artifact':[]}
          for folder in folders:
              files=sorted(str(p.relative_to(folder)) for p in folder.rglob('*') if p.is_file())
              manifest['artifact'].append({'nome':folder.name,'file':files})
          (out/'manifest_artifact.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False),encoding='utf-8')
          archive=pathlib.Path('macro-swing-lab-pit-v3-diagnostica-completa.zip')
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for base,prefix in [(root,'artifact_serie'),(out,'riepilogo')]:
                  if base.exists():
                      for p in sorted(base.rglob('*')):
                          if p.is_file():z.write(p,str(pathlib.Path(prefix)/p.relative_to(base)))
          print('Creato:',archive,'artifact trovati:',len(folders))
          PY
      - name: Pubblica UN SOLO artifact finale
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-swing-lab-pit-v3-diagnostica-completa
          path: macro-swing-lab-pit-v3-diagnostica-completa.zip
          if-no-files-found: error
          retention-days: 30
