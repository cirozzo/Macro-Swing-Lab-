name: Macro Swing Lab - Associazione PIT
on:
  workflow_dispatch:
jobs:
  verifica:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python associa_pit_definitivo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-swing-lab-associazione-pit
          path: associazione_pit_risultati/
