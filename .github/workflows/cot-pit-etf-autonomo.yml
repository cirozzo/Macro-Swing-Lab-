name: COT PIT ETF - pipeline autonoma

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: python -m pip install --upgrade pip pandas numpy yfinance requests
      - name: Individua input macro PIT senza dipendere da artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import pandas as pd
          target=Path('input/regimi_pit_49.csv')
          required={'data_segnale','vintage_asof','regime_pit_49'}
          candidates=[]
          for p in Path('.').rglob('*.csv'):
              if '.git' in p.parts: continue
              try:
                  cols=set(pd.read_csv(p,nrows=0).columns)
                  if required<=cols: candidates.append(('file',str(p),None))
              except Exception: pass
          for archive in Path('.').rglob('*.zip'):
              if '.git' in archive.parts: continue
              try:
                  with ZipFile(archive) as z:
                      for name in z.namelist():
                          if not name.lower().endswith('.csv'): continue
                          try:
                              with z.open(name) as f:
                                  cols=set(pd.read_csv(f,nrows=0).columns)
                              if required<=cols: candidates.append(('zip',str(archive),name))
                          except Exception: continue
              except Exception: continue
          print('Dataset macro compatibili:',candidates,flush=True)
          if target.is_file():
              chosen=('file',str(target),None)
          else:
              exact=[c for c in candidates if Path(c[2] or c[1]).name=='regimi_pit_49.csv']
              pool=exact or candidates
              if len(pool)!=1:
                  raise SystemExit(f'INPUT MACRO PIT NON UNIVOCO: trovati {len(pool)} candidati. Serve un CSV con colonne {sorted(required)}. Nessun dataset sintetico viene creato.')
              chosen=pool[0]
          target.parent.mkdir(parents=True,exist_ok=True)
          if chosen[0]=='zip':
              with ZipFile(chosen[1]) as z, z.open(chosen[2]) as f:
                  target.write_bytes(f.read())
          elif Path(chosen[1])!=target:
              target.write_bytes(Path(chosen[1]).read_bytes())
          df=pd.read_csv(target)
          if df.empty or not required<=set(df.columns): raise SystemExit('Input PIT vuoto o schema non valido')
          print('Input PIT pronto:',target,'righe:',len(df))
          PY
      - name: Genera dataset ETF da zero
        run: python etf_regimi_pit_52.py --input input/regimi_pit_49.csv --outdir output/etf_pit_52
      - name: Verifica e crea ZIP richiesto dallo script COT
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import pandas as pd
          src=Path('output/etf_pit_52/osservazioni_pit_52.csv')
          if not src.is_file(): raise SystemExit('Osservazioni ETF non prodotte')
          df=pd.read_csv(src)
          required={'asset','data_segnale','vintage_asof','data_ingresso','data_uscita','rendimento'}
          if df.empty or not required<=set(df.columns): raise SystemExit('Osservazioni ETF vuote o incomplete')
          with ZipFile('etf-pit-52.zip','w',ZIP_DEFLATED) as z:
              z.write(src,'osservazioni_pit_52.csv')
          print('Creato etf-pit-52.zip con',len(df),'osservazioni')
          PY
      - name: Elabora CFTC COT
        run: python cot_pit_etf.py --etf-zip etf-pit-52.zip --out cot_results
      - name: Salva report anche se un passaggio fallisce
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cot-pit-etf-diagnostica
          path: |
            cot_results/
            output/etf_pit_52/
          if-no-files-found: warn
