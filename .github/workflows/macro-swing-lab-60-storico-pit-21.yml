name: Macro Swing Lab 6.0 - Storico ALFRED PIT fase 2.1

on:
  workflow_dispatch:
    inputs:
      max_series:
        description: 'Numero di serie (0 = tutte le 36 disponibili)'
        required: false
        default: '12'
      max_signals:
        description: 'Venerdi campionati (0 = tutti, solo dopo validazione pilota)'
        required: false
        default: '24'

permissions:
  contents: read

jobs:
  storico-pit-21:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.2,<3'
      - name: Offline quality tests
        run: python storico_pit_61.py --offline-test
      - name: Acquire ALFRED PIT snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MAX_SERIES: ${{ inputs.max_series }}
          MAX_SIGNALS: ${{ inputs.max_signals }}
        run: |
          python storico_pit_61.py --catalog catalogo_fonti_60.csv \
            --max-series "${MAX_SERIES:-12}" --max-signals "${MAX_SIGNALS:-24}" \
            --out output/storico_pit_61
      - name: Upload audit and data even if acquisition fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storico-pit-61
          path: output/storico_pit_61/
          if-no-files-found: warn
          retention-days: 30
