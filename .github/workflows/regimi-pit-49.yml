name: Macro Swing Lab 4.9 - ALFRED PIT (isolato)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regimi-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.1,<3'
      - name: Compute point-in-time regimes
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python regimi_pit_49.py
      - name: Save diagnostic CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: regimi-pit-49
          path: output/regimi_pit_49.csv
          if-no-files-found: error
