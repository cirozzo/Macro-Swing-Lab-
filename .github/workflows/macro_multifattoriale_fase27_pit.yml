name: Macro Swing Lab - Fase 27 integrazione macro PIT esistente

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrate-existing-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.1,<3' 'numpy>=1.26,<3'
      - name: Locate Phase 26 artifact or repository copy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase26_input
          if test -f macro-swing-lab-fase26-risultati.zip; then
            cp macro-swing-lab-fase26-risultati.zip phase26_input/fase26.zip
            echo "Using phase26 ZIP from repository root"
          else
            run_id="$(gh run list --workflow macro_multifattoriale_fase26.yml --status success --limit 30 --json databaseId --jq '.[0].databaseId' || true)"
            if test -z "$run_id"; then
              echo 'ERROR: No successful Fase26 workflow found. Upload macro-swing-lab-fase26-risultati.zip in root.' >&2
              exit 1
            fi
            gh run download "$run_id" -n macro-swing-lab-fase26-risultati -D phase26_input
            test -f phase26_input/base_giornaliera_lag14.csv || { echo 'Fase26 artifact is missing CSV.' >&2; exit 1; }
            echo 'Using GitHub Actions Fase26 artifact'
          fi
      - name: Integrate previously certified macro PIT dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f macro_pit_consolidato.csv || { echo 'ERROR: missing macro_pit_consolidato.csv in repository root.' >&2; exit 1; }
          test -f fase27_integra_pit.py || { echo 'ERROR: missing fase27_integra_pit.py in repository root.' >&2; exit 1; }
          if test -f phase26_input/fase26.zip; then
            python fase27_integra_pit.py --fase26 phase26_input/fase26.zip --macro-pit macro_pit_consolidato.csv --out fase27_risultati
          else
            python fase27_integra_pit.py --fase26 phase26_input --macro-pit macro_pit_consolidato.csv --out fase27_risultati
          fi
      - name: Always upload diagnostics and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-swing-lab-fase27-pit-risultati
          path: fase27_risultati/
          if-no-files-found: warn
          retention-days: 30
