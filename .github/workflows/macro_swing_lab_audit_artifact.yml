name: Macro Swing Lab - Audit artifact pesante

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID della run che contiene l'artifact originale"
        required: true
        type: string
      artifact_name:
        description: "Nome esatto dell'artifact da analizzare"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verifica risorse disponibili
        run: |
          set -euo pipefail
          echo "Cartella corrente:"
          pwd

          echo "File nella cartella principale:"
          ls -lah

          echo "Versione Python:"
          python --version

          echo "Spazio disponibile:"
          df -h .

      - name: Verifica presenza script Python
        run: |
          set -euo pipefail

          if [ ! -f "audit_artifact.py" ]; then
            echo "::error::File audit_artifact.py non trovato nella cartella principale del repository."
            echo "Inserisci audit_artifact.py nella root del branch utilizzato."
            exit 1
          fi

          echo "Script Python trovato correttamente."

      - name: Scarica artifact originale
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p input_artifact

          gh run download "$RUN_ID" \
            --repo "$GH_REPO" \
            --name "$ARTIFACT_NAME" \
            --dir input_artifact

          echo "Download completato."

          echo "Dimensione dati:"
          du -sh input_artifact

          echo "Spazio residuo:"
          df -h .

      - name: Analizza dati e genera report compatto
        run: |
          set -euo pipefail

          python audit_artifact.py \
            --root input_artifact \
            --output output_audit \
            --samples 12

          echo "Analisi completata."

          echo "Dimensione report:"
          du -sh output_audit

          echo "File generati:"
          ls -lah output_audit

      - name: Pubblica report compatto
        if: always() && hashFiles('output_audit/inventario.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: macro-swing-lab-audit-compatto
          path: output_audit/
          retention-days: 30
          if-no-files-found: error
