name: Aggiorna Macro Swing Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1-5'

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.1,<3' 'numpy>=1.26,<3' 'yfinance>=0.2.50,<2'

      - name: Esegui backtest
        run: python backtest_macro.py

      - name: Salva risultati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add output/osservazioni.csv output/risultati.csv

          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna risultati Macro Swing Lab'
            git push
          fi
