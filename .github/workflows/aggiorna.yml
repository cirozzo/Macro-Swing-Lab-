name: Macro Swing Lab 4.7 - Ricerca Offline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-swing-lab
  cancel-in-progress: false

jobs:

  ricerca:
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # =====================================
      # 1. PREPARAZIONE
      # =====================================

      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa librerie
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "pandas>=2.1,<3" \
            "numpy>=1.26,<3" \
            "yfinance>=0.2.50,<2"

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      # =====================================
      # 2. VERIFICA DATI STORICI
      # =====================================

      - name: Controlla dataset 4.6
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("output/osservazioni_46.csv")

          if not path.exists():
              raise FileNotFoundError(
                  "Manca output/osservazioni_46.csv"
              )

          df = pd.read_csv(
              path,
              usecols=[
                  "data_segnale",
                  "asset",
                  "regime",
                  "settimane"
              ]
          )

          if df.empty:
              raise RuntimeError(
                  "Dataset storico 4.6 vuoto"
              )

          dates = pd.to_datetime(
              df["data_segnale"]
          )

          print("================================")
          print("DATASET STORICO 4.6")
          print("================================")

          print("Osservazioni:", len(df))
          print("Asset:", df["asset"].nunique())
          print("Regimi:", df["regime"].nunique())
          print("Orizzonti:", df["settimane"].nunique())
          print("Prima osservazione:", dates.min())
          print("Ultima osservazione:", dates.max())

          print("================================")
          print("ATTENZIONE:")
          print("Regimi macro NON point-in-time")
          print("Dataset storico non aggiornato")
          print("durante questa esecuzione")
          print("================================")
          PY

      # =====================================
      # 3. ESECUZIONE VERSIONE 4.7
      # =====================================

      - name: Ranking volatilita 4.7
        run: |
          python ranking_volatilita_47.py

      # =====================================
      # 4. VERIFICA FILE GENERATI
      # =====================================

      - name: Verifica risultati 4.7
        run: |
          echo "VERIFICA RISULTATI 4.7"

          for file in \
            output/osservazioni_volatilita_47.csv \
            output/episodi_non_overlap_47.csv \
            output/statistiche_regimi_47.csv \
            output/stabilita_annuale_47.csv \
            output/ranking_ricerca_47.csv
          do

            if [ ! -s "$file" ]; then
              echo "ERRORE: $file mancante o vuoto"
              exit 1
            fi

            echo "OK: $file"

          done

      # =====================================
      # 5. CONTROLLO STATISTICO
      # =====================================

      - name: Controlla ranking
        run: |
          python - <<'PY'
          import pandas as pd

          path = "output/ranking_ricerca_47.csv"

          df = pd.read_csv(path)

          required = [
              "asset",
              "regime",
              "settimane",
              "score_descrittivo",
              "posizione_nel_regime"
          ]

          missing = [
              c for c in required
              if c not in df.columns
          ]

          if missing:
              raise ValueError(
                  f"Colonne mancanti: {missing}"
              )

          if df.empty:
              raise RuntimeError(
                  "Ranking vuoto"
              )

          keys = [
              "asset",
              "regime",
              "settimane"
          ]

          if df.duplicated(keys).any():
              raise RuntimeError(
                  "Combinazioni duplicate"
              )

          print("================================")
          print("RANKING 4.7")
          print("================================")

          print("Combinazioni:", len(df))
          print("Asset:", df["asset"].nunique())
          print("Regimi:", df["regime"].nunique())
          print("Orizzonti:", df["settimane"].nunique())

          print("================================")
          print("DATI NON POINT-IN-TIME")
          print("RANKING DESCRITTIVO")
          print("================================")
          PY

      # =====================================
      # 6. PUBBLICAZIONE
      # =====================================

      - name: Pubblica risultati
        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          if ! git diff --cached --quiet; then

            git commit -m \
              "Macro Swing Lab 4.7 ranking offline"

            git push

          else

            echo "Nessuna modifica da pubblicare"

          fi

      # =====================================
      # 7. COMPLETAMENTO
      # =====================================

      - name: Conferma completamento
        run: |
          echo "================================"
          echo "MACRO SWING LAB 4.7 COMPLETATO"
          echo "================================"
          echo "Ranking statistico: OK"
          echo "Normalizzazione volatilita: OK"
          echo "Confronto baseline: OK"
          echo "Stabilita annuale: OK"
          echo "================================"
          echo "Modalita: OFFLINE MACRO"
          echo "Ricerca NON point-in-time"
