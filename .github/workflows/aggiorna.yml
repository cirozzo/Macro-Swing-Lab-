name: Aggiorna Macro Swing Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: macro-swing-lab
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ==========================================
      # PREPARAZIONE AMBIENTE
      # ==========================================

      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifica Python
        run: python --version

      - name: Installa le librerie
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pandas>=2.1,<3' \
            'numpy>=1.26,<3' \
            'yfinance>=0.2.50,<2'

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      # ==========================================
      # MACRO SWING LAB 3.0
      # ==========================================

      - name: Esegui il backtest Macro Swing Lab 3.0
        run: |
          python backtest_macro.py

      # ==========================================
      # VALIDAZIONE STATISTICA 3.1
      # ==========================================

      - name: Esegui la validazione statistica 3.1
        run: |
          python valida_strategie.py

      # ==========================================
      # MACRO SWING LAB 4.0
      # ==========================================

      - name: Esegui Macro Swing Lab 4.0
        run: |
          python macro_swing_40.py

      # ==========================================
      # VALIDAZIONE STATISTICA 4.1
      # ==========================================

      - name: Esegui la validazione statistica 4.1
        run: |
          python valida_41.py

      # ==========================================
      # MACRO SWING LAB 4.2
      # ANALISI MOMENTUM PER REGIME MACRO
      # ==========================================

      - name: Analizza Momentum per regime macro 4.2
        run: |
          python analisi_regimi_42.py

      # ==========================================
      # VERIFICA FILE GENERATI
      # ==========================================

      - name: Verifica i file generati
        run: |
          echo "=================================="
          echo "VERIFICA MACRO SWING LAB"
          echo "=================================="

          echo "Verifica versione 3.0"
          test -s output/osservazioni.csv
          test -s output/risultati.csv
          test -s output/strategie.csv
          test -s output/confronto_strategie.csv

          echo "Verifica versione 3.1"
          test -s output/validazione_31.csv

          echo "Verifica versione 4.0"
          test -s output/osservazioni_40.csv
          test -s output/regimi_asset_40.csv
          test -s output/scelte_modelli_40.csv
          test -s output/confronto_modelli_40.csv
          test -s output/watchlist_40.csv

          echo "Verifica versione 4.1"
          test -s output/validazione_41.csv
          test -s output/validazione_41_annuale.csv
          test -s output/validazione_41_non_overlap.csv
          test -s output/validazione_41_differenze.csv

          echo "Verifica versione 4.2"
          test -s output/regimi_momentum_42.csv
          test -s output/regimi_momentum_annuale_42.csv
          test -s output/regimi_momentum_osservazioni_42.csv

          echo "=================================="
          echo "TUTTI I FILE SONO PRESENTI"
          echo "=================================="

      # ==========================================
      # PUBBLICAZIONE AUTOMATICA RISULTATI
      # ==========================================

      - name: Pubblica i risultati sul repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            output/osservazioni.csv \
            output/risultati.csv \
            output/strategie.csv \
            output/confronto_strategie.csv \
            output/validazione_31.csv \
            output/osservazioni_40.csv \
            output/regimi_asset_40.csv \
            output/scelte_modelli_40.csv \
            output/confronto_modelli_40.csv \
            output/watchlist_40.csv \
            output/validazione_41.csv \
            output/validazione_41_annuale.csv \
            output/validazione_41_non_overlap.csv \
            output/validazione_41_differenze.csv \
            output/regimi_momentum_42.csv \
            output/regimi_momentum_annuale_42.csv \
            output/regimi_momentum_osservazioni_42.csv

          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna Macro Swing Lab 4.2"
            git push
          else
            echo "Nessuna modifica ai risultati."
          fi

      # ==========================================
      # FINE ESECUZIONE
      # ==========================================

      - name: Conferma completamento
        run: |
          echo "=================================="
          echo "MACRO SWING LAB 4.2 COMPLETATO"
          echo "=================================="
          echo "Backtest 3.0: OK"
          echo "Validazione 3.1: OK"
          echo "Ricerca multi-asset 4.0: OK"
          echo "Validazione 4.1: OK"
          echo "Analisi regimi Momentum 4.2: OK"
