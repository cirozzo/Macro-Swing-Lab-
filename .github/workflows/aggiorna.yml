name: Aggiorna Macro Swing Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: macro-swing-lab
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
        continue-on-error: true

      - name: Verifica Python
        run: python --version

      - name: Installa le librerie
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pandas>=2.1,<3' \
            'numpy>=1.26,<3' \
            'yfinance>=0.2.50,<2'

      # =========================================
      # MACRO SWING LAB 3.0
      # =========================================

      - name: Esegui il backtest Macro Swing Lab 3.0
        run: |
          python backtest_macro.py

      # =========================================
      # MACRO SWING LAB 3.1
      # =========================================

      - name: Esegui la validazione statistica 3.1
        run: |
          python valida_strategie.py

      # =========================================
      # MACRO SWING LAB 4.0
      # =========================================

      - name: Esegui Macro Swing Lab 4.0
        run: |
          python macro_swing_40.py

      # =========================================
      # VERIFICA RISULTATI
      # =========================================

      - name: Verifica i file generati
        run: |
          echo "Verifica Macro Swing Lab 3.0..."
          test -s output/osservazioni.csv
          test -s output/risultati.csv
          test -s output/strategie.csv
          test -s output/confronto_strategie.csv

          echo "Verifica Macro Swing Lab 3.1..."
          test -s output/validazione_31.csv

          echo "Verifica Macro Swing Lab 4.0..."
          test -s output/osservazioni_40.csv
          test -s output/regimi_asset_40.csv
          test -s output/scelte_modelli_40.csv
          test -s output/confronto_modelli_40.csv
          test -s output/watchlist_40.csv

          echo "Tutti i file sono stati generati."

      # =========================================
      # PUBBLICAZIONE
      # =========================================

      - name: Pubblica i risultati sul repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            output/osservazioni.csv \
            output/risultati.csv \
            output/strategie.csv \
            output/confronto_strategie.csv \
            output/validazione_31.csv \
            output/osservazioni_40.csv \
            output/regimi_asset_40.csv \
            output/scelte_modelli_40.csv \
            output/confronto_modelli_40.csv \
            output/watchlist_40.csv

          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna Macro Swing Lab 4.0"
            git push
          else
            echo "Nessuna modifica ai risultati."
          fi
