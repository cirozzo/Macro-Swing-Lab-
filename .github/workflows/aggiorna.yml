name: Macro Swing Lab 4.8 - Validazione Offline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-swing-lab
  cancel-in-progress: false

jobs:
  ricerca:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ======================================
      # PREPARAZIONE
      # ======================================

      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ======================================
      # INSTALLAZIONE LIBRERIE
      # ======================================

      - name: Installa librerie
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            'numpy>=1.26,<3' \
            'pandas>=2.1,<3' \
            'scipy>=1.11,<2' \
            'statsmodels>=0.14,<1'

      # ======================================
      # CONTROLLO DATASET
      # ======================================

      - name: Verifica dataset 4.7
        run: |
          test -s output/osservazioni_volatilita_47.csv

          test -s validazione_statistica_48.py

      # ======================================
      # VALIDAZIONE STATISTICA 4.8
      # ======================================

      - name: Esegui validazione statistica 4.8
        run: |
          python validazione_statistica_48.py

      # ======================================
      # VERIFICA OUTPUT
      # ======================================

      - name: Verifica file 4.8
        run: |
          for file in \
            output/stabilita_annuale_48.csv \
            output/walk_forward_48.csv \
            output/test_statistici_48.csv \
            output/ranking_validato_48.csv
          do

            if [ ! -s "$file" ]; then

              echo "ERRORE: $file mancante"
              exit 1

            fi

            echo "OK: $file"

          done

      # ======================================
      # PUBBLICAZIONE AUTOMATICA
      # ======================================

      - name: Pubblica risultati
        run: |
          git config user.name 'github-actions[bot]'

          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add output/*_48.csv

          if ! git diff --cached --quiet; then

            git commit -m \
              'Macro Swing Lab 4.8 validazione offline'

            git push

          else

            echo "Nessuna modifica ai risultati"

          fi
