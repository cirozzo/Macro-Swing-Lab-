name: Macro Swing Lab - Fase 26 base multifattoriale
on:
  workflow_dispatch:
  push:
    paths:
      - 'costruisci_base.py'
      - 'TVC_USOIL, 1D.zip'
      - 'TVC_USOIL, 240.zip'
      - 'cot-wti-audit-unificato.zip'
      - '.github/workflows/macro_multifattoriale_fase26.yml'
permissions:
  contents: read
jobs:
  costruisci_base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Controlla file di input
        run: |
          test -s costruisci_base.py
          test -s 'TVC_USOIL, 1D.zip'
          test -s 'TVC_USOIL, 240.zip'
          test -s cot-wti-audit-unificato.zip
      - name: Costruisci dataset e audit
        run: python costruisci_base.py
      - name: Pubblica risultati anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-swing-lab-fase26-risultati
          path: risultati/
          if-no-files-found: warn
          retention-days: 30
