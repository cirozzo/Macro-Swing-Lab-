name: Macro Swing Lab - Fase 28 unica verifiche e acquisizione
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fase28:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dipendenze fissate
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 requests==2.32.3 beautifulsoup4==4.12.3
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s fase28_unica.py || { echo 'Manca fase28_unica.py nella root'; exit 1; }
          test -s macro-swing-lab-fase27-pit-risultati.zip || { echo 'Manca ZIP originale Fase27 nella root'; exit 1; }
          test -s tests/test_fase28.py || { echo 'Manca tests/test_fase28.py'; exit 1; }
          python -m py_compile fase28_unica.py
      - name: Test di regressione - primo passaggio
        run: python -m unittest discover -s tests -v
      - name: Test di regressione - secondo passaggio
        run: python -m unittest discover -s tests -v
      - name: Acquisizione e integrazione
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python fase28_unica.py --input macro-swing-lab-fase27-pit-risultati.zip --out fase28_risultati
      - name: Pubblica l'audit anche se fallisce l'acquisizione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-swing-lab-fase28-unica-risultati
          path: fase28_risultati/
          if-no-files-found: warn
          retention-days: 30
